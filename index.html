<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineFind</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="logo">CineFind</header>

    <main>
      <!-- Hero section -->
      <section class="hero">
        <div class="hero-content">
          <h1>Find your next movie</h1>
          <p class="description">
            Search for movies and discover something worth watching.
          </p>

          <!-- search form -->
          <form class="search-form">
            <input type="text" name="movie" placeholder="Search for a movie" />
            <button type="submit">Search</button>
          </form>
        </div>
      </section>

      <!-- Results section -->
      <section class="results-section">
        <h2>Movie Results</h2>
        <div class="movie-grid">
          <!-- movie card -->
          <div class="movie-card">
            <img src="https://via.placeholder.com/300x450" alt="Movie poster" />

            <div class="movie-info">
              <h3>Inception</h3>

              <div class="movie-meta">
                <span>2010</span>
                <span>⭐ 8.8</span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer>Made with 💗</footer>
  </body>
</html>
